name: Smoke (docker compose)

# Actually boots the whole stack on the runner: build -> up -> health probes.
# This is the closest thing to "does the project really work" that can run
# without a local machine.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build and start the stack
        id: up
        run: |
          set -x
          status=0
          docker compose up -d --build || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Wait for health endpoints
        id: probe
        if: steps.up.outputs.status == '0'
        run: |
          probe() {
            name="$1"; url="$2"; deadline=$((SECONDS + 600))
            while [ $SECONDS -lt $deadline ]; do
              if curl -fsS --max-time 5 "$url" > /dev/null; then
                echo "OK   $name ($url)"
                return 0
              fi
              sleep 5
            done
            echo "FAIL $name ($url)"
            return 1
          }
          status=0
          probe analytics-engine http://localhost:8081/healthz || status=1
          probe api-gateway      http://localhost:8080/healthz || status=1
          probe data-fetcher     http://localhost:8083/healthz || status=1
          probe frontend         http://localhost:3000/         || status=1
          # readyz means the gateway can actually reach the analytics engine
          probe gateway-ready    http://localhost:8080/readyz    || status=1
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Collect state and logs
        if: always()
        run: |
          out="$RUNNER_TEMP/smoke.log"
          {
            echo '--- docker compose ps ---'
            docker compose ps || true
            echo
            for svc in kafka-init data-fetcher analytics-engine api-gateway websocket-server frontend; do
              echo "--- logs: $svc (tail 60) ---"
              docker compose logs --tail 60 "$svc" 2>&1 || true
              echo
            done
          } > "$out"
          cat "$out"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke.log
          if-no-files-found: ignore

      - name: Comment result on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.up.outputs.status }}" = "0" ] && [ "${{ steps.probe.outputs.status }}" = "0" ]; then
            title='### Smoke: the stack came up and every health endpoint answered'
          else
            title='### Smoke failed'
          fi
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$title"
            echo
            echo "Commit \`${{ github.sha }}\` - [full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo
            echo '```'
            tail -n 250 "$RUNNER_TEMP/smoke.log" 2>/dev/null || echo 'no log collected'
            echo '```'
          } > "$body"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true

      - name: Fail if the stack did not come up
        if: steps.up.outputs.status != '0' || steps.probe.outputs.status != '0'
        run: exit 1
